<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="main.js" defer></script>
<body>
    <div class="container">
        <div class="main">
            <p class="input" placeholder="0"></p>
            <button onclick="enterElem('C')">C</button>
            <button class="delete-button" onclick="enterElem('del');"><img class="backspace-img" src="image/backspace-svgrepo-com.svg" alt=""></button>
            <button class="operator" onclick="enterElem('%')">%</button>
            <button class="operator" onclick="enterElem('/')">/</button>
            <button onclick="enterElem(7)">7</button>
            <button onclick="enterElem(8)">8</button>
            <button onclick="enterElem(9)">9</button>
            <button onclick="enterElem('*')">*</button>
            <button onclick="enterElem(4)">4</button>
            <button onclick="enterElem(5)">5</button>
            <button onclick="enterElem(6)">6</button>
            <button class="operator" onclick="enterElem('-')">-</button>
            <button onclick="enterElem(1)">1</button>
            <button onclick="enterElem(2)">2</button>
            <button onclick="enterElem(3)">3</button>
            <button onclick="enterElem('+')" class="operator">+</button>
            <button onclick="enterElem(0)">0</button>
            <button onclick="enterElem('.')">.</button>
            <button onclick="enterElem('=')" class="stretch-button">=</button>
        </div>
    </div>

</body>
</html>
